name: Courier PWA

on:
  pull_request:
    paths:
      - "apps/courier/**"
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/courier-pwa.yml"

jobs:
  verify-courier-pwa:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/behshahr_delivery?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: 4000
      API_INTERNAL_URL: http://127.0.0.1:4000/api
      NODE_ENV: test
      SMS_PROVIDER: console
      DEV_OTP_CODE: "123456"
      OTP_SECRET: ci-otp-secret-change-me
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      SERVICE_CENTER_LAT: "36.700000"
      SERVICE_CENTER_LNG: "53.550000"
      SERVICE_RADIUS_METERS: "20000"
      ROUTE_DISTANCE_FACTOR: "1.25"
      ROUTE_AVG_SPEED_KMH: "25"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: behshahr_delivery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d behshahr_delivery"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @behshahr-delivery/api prisma:migrate:deploy
      - name: Seed courier and pricing
        run: |
          pnpm --filter @behshahr-delivery/api exec node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            await db.connect();
            await db.query(`
              INSERT INTO "pricing_rules" ("id","vehicle_type","base_fare","included_distance_meters","per_km_fare","minimum_fare","surge_multiplier","is_active","created_at","updated_at")
              VALUES ('00000000-0000-4000-8000-000000000201','MOTORBIKE',50000,1000,15000,50000,1.00,true,NOW(),NOW());
              INSERT INTO "users" ("id","phone","role","status","created_at","updated_at")
              VALUES ('00000000-0000-4000-8000-000000000210','+989111111111','COURIER','ACTIVE',NOW(),NOW());
              INSERT INTO "couriers" ("id","user_id","vehicle_type","status","created_at","updated_at")
              VALUES ('00000000-0000-4000-8000-000000000211','00000000-0000-4000-8000-000000000210','MOTORBIKE','OFFLINE',NOW(),NOW());
            `);
            await db.end();
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
      - run: pnpm --filter @behshahr-delivery/api build
      - run: pnpm --filter @behshahr-delivery/courier typecheck
      - run: pnpm --filter @behshahr-delivery/courier build
      - name: Smoke test courier PWA lifecycle
        run: |
          pnpm --filter @behshahr-delivery/api start > /tmp/courier-api.log 2>&1 &
          API_PID=$!
          pnpm --filter @behshahr-delivery/courier start > /tmp/courier-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID || true' EXIT

          API_READY=0
          WEB_READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then API_READY=1; fi
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then WEB_READY=1; fi
            if [ "$API_READY" -eq 1 ] && [ "$WEB_READY" -eq 1 ]; then break; fi
            sleep 1
          done
          if [ "$API_READY" -ne 1 ] || [ "$WEB_READY" -ne 1 ]; then
            cat /tmp/courier-api.log
            cat /tmp/courier-web.log
            exit 1
          fi

          node <<'NODE'
          const api = 'http://127.0.0.1:4000/api';
          const web = 'http://127.0.0.1:3001';
          async function json(url, options = {}, expected) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (expected && response.status !== expected) throw new Error(`${url} expected ${expected}, got ${response.status}: ${JSON.stringify(body)}`);
            if (!expected && !response.ok) throw new Error(`${url} failed ${response.status}: ${JSON.stringify(body)}`);
            return { response, body };
          }
          async function apiLogin(phone) {
            await json(`${api}/auth/request-otp`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone}) });
            return (await json(`${api}/auth/verify-otp`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone,code:'123456'}) })).body;
          }

          const customer = await apiLogin('+989112222222');
          const auth = { authorization:`Bearer ${customer.accessToken}`, 'content-type':'application/json' };
          const pickup = (await json(`${api}/addresses`, { method:'POST', headers:auth, body:JSON.stringify({title:'مبدا تست',formattedAddress:'بهشهر - مبدا تست',latitude:36.70,longitude:53.55}) })).body;
          const dropoff = (await json(`${api}/addresses`, { method:'POST', headers:auth, body:JSON.stringify({title:'مقصد تست',formattedAddress:'بهشهر - مقصد تست',latitude:36.71,longitude:53.56}) })).body;
          const quote = (await json(`${api}/quotes`, { method:'POST', headers:auth, body:JSON.stringify({pickupAddressId:pickup.id,dropoffAddressId:dropoff.id,vehicleType:'MOTORBIKE'}) })).body;
          const order = (await json(`${api}/orders`, { method:'POST', headers:auth, body:JSON.stringify({quoteId:quote.quoteId,notes:'Courier PWA smoke'}) })).body;

          await json(`${web}/api/session/request-otp`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone:'+989112222222'}) });
          await json(`${web}/api/session/verify-otp`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone:'+989112222222',code:'123456'}) }, 403);

          let cookie = '';
          function absorb(response) {
            const values = typeof response.headers.getSetCookie === 'function' ? response.headers.getSetCookie() : [];
            const next = values.map(v => v.split(';')[0]);
            if (next.length) cookie = next.join('; ');
          }
          await json(`${web}/api/session/request-otp`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone:'+989111111111'}) });
          const verified = await json(`${web}/api/session/verify-otp`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone:'+989111111111',code:'123456'}) });
          absorb(verified.response);
          if (!cookie) throw new Error('courier session cookie missing');

          const webHeaders = { cookie, 'content-type':'application/json' };
          const profile = (await json(`${web}/api/courier/profile`, { headers:webHeaders })).body;
          if (profile.status !== 'OFFLINE') throw new Error(`unexpected courier profile ${JSON.stringify(profile)}`);
          await json(`${web}/api/courier/location`, { method:'POST', headers:webHeaders, body:JSON.stringify({latitude:36.701,longitude:53.551}) });
          await json(`${web}/api/courier/availability`, { method:'PATCH', headers:webHeaders, body:JSON.stringify({status:'AVAILABLE'}) });
          const queue = (await json(`${web}/api/courier/orders/available`, { headers:webHeaders })).body;
          if (!Array.isArray(queue) || !queue.some(item => item.id === order.id)) throw new Error(`order missing from courier queue ${JSON.stringify(queue)}`);
          await json(`${web}/api/courier/orders/${order.id}/accept`, { method:'POST', headers:webHeaders });
          const current = (await json(`${web}/api/courier/orders/current`, { headers:webHeaders })).body;
          if (current?.id !== order.id || current.status !== 'ASSIGNED') throw new Error(`current mission invalid ${JSON.stringify(current)}`);
          await json(`${web}/api/courier/orders/${order.id}/picked-up`, { method:'POST', headers:webHeaders });
          const delivered = (await json(`${web}/api/courier/orders/${order.id}/delivered`, { method:'POST', headers:webHeaders })).body;
          if (delivered.status !== 'DELIVERED') throw new Error('delivery transition failed');
          const emptyCurrent = (await json(`${web}/api/courier/orders/current`, { headers:webHeaders })).body;
          if (emptyCurrent !== null) throw new Error('current mission should be empty after delivery');
          const finalProfile = (await json(`${web}/api/courier/profile`, { headers:webHeaders })).body;
          if (finalProfile.status !== 'AVAILABLE') throw new Error('courier should return AVAILABLE after delivery');
          NODE
