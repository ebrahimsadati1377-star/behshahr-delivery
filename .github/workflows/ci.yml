name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/behshahr_delivery?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: 4000
      NODE_ENV: test
      SMS_PROVIDER: console
      DEV_OTP_CODE: "123456"
      OTP_SECRET: ci-otp-secret-change-me
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      SERVICE_CENTER_LAT: "36.700000"
      SERVICE_CENTER_LNG: "53.550000"
      SERVICE_RADIUS_METERS: "20000"
      ROUTE_DISTANCE_FACTOR: "1.25"
      ROUTE_AVG_SPEED_KMH: "25"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: behshahr_delivery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d behshahr_delivery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @behshahr-delivery/api prisma:validate
      - run: pnpm --filter @behshahr-delivery/api prisma:migrate:deploy
      - name: Seed CI pricing rule
        run: |
          pnpm --filter @behshahr-delivery/api exec node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(`
              INSERT INTO "pricing_rules" (
                "id", "vehicle_type", "base_fare", "included_distance_meters",
                "per_km_fare", "minimum_fare", "surge_multiplier", "is_active",
                "created_at", "updated_at"
              ) VALUES (
                '00000000-0000-4000-8000-000000000001', 'MOTORBIKE', 50000, 1000,
                15000, 50000, 1.00, true, NOW(), NOW()
              )
            `);
            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test customer order flow
        run: |
          pnpm --filter @behshahr-delivery/api start > /tmp/behshahr-delivery-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT

          READY=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/behshahr-delivery-api.log
            exit 1
          fi

          node <<'NODE'
          const base = 'http://127.0.0.1:4000/api';
          const phone = '+989111234567';

          async function jsonRequest(path, options = {}) {
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: {
                'content-type': 'application/json',
                ...(options.headers ?? {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(`${path} failed ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          await jsonRequest('/auth/request-otp', {
            method: 'POST',
            body: JSON.stringify({ phone }),
          });

          const session = await jsonRequest('/auth/verify-otp', {
            method: 'POST',
            body: JSON.stringify({ phone, code: '123456' }),
          });

          if (!session.accessToken || !session.refreshToken) {
            throw new Error('verify-otp did not return token pair');
          }

          const authHeaders = { authorization: `Bearer ${session.accessToken}` };
          const me = await jsonRequest('/auth/me', { headers: authHeaders });

          if (me.user.phone !== phone || me.user.role !== 'CUSTOMER') {
            throw new Error(`unexpected authenticated user: ${JSON.stringify(me)}`);
          }

          const pickup = await jsonRequest('/addresses', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify({
              title: 'Pickup',
              formattedAddress: 'CI pickup address',
              latitude: 36.700000,
              longitude: 53.550000,
            }),
          });

          const dropoff = await jsonRequest('/addresses', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify({
              title: 'Dropoff',
              formattedAddress: 'CI dropoff address',
              latitude: 36.710000,
              longitude: 53.560000,
            }),
          });

          const updatedPickup = await jsonRequest(`/addresses/${pickup.id}`, {
            method: 'PATCH',
            headers: authHeaders,
            body: JSON.stringify({ title: 'Updated Pickup' }),
          });

          if (updatedPickup.title !== 'Updated Pickup') {
            throw new Error('address update did not persist');
          }

          const quote = await jsonRequest('/quotes', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify({
              pickupAddressId: pickup.id,
              dropoffAddressId: dropoff.id,
              vehicleType: 'MOTORBIKE',
            }),
          });

          if (!quote.quoteId || quote.priceToman < 50000 || quote.routingMode !== 'APPROXIMATE') {
            throw new Error(`unexpected quote: ${JSON.stringify(quote)}`);
          }

          const order = await jsonRequest('/orders', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify({ quoteId: quote.quoteId, notes: 'CI order' }),
          });

          if (
            order.status !== 'REQUESTED' ||
            order.vehicleType !== 'MOTORBIKE' ||
            order.quotedPriceToman !== quote.priceToman ||
            order.pickupSnapshot.title !== 'Updated Pickup'
          ) {
            throw new Error(`unexpected order: ${JSON.stringify(order)}`);
          }

          const reusedQuote = await fetch(`${base}/orders`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              ...authHeaders,
            },
            body: JSON.stringify({ quoteId: quote.quoteId }),
          });

          if (reusedQuote.status !== 404) {
            throw new Error(`used quote should be rejected, got ${reusedQuote.status}`);
          }

          const orders = await jsonRequest('/orders', { headers: authHeaders });
          if (!Array.isArray(orders) || orders.length !== 1 || orders[0].id !== order.id) {
            throw new Error(`unexpected order history: ${JSON.stringify(orders)}`);
          }

          const detail = await jsonRequest(`/orders/${order.id}`, {
            headers: authHeaders,
          });

          if (
            !Array.isArray(detail.events) ||
            detail.events.length !== 1 ||
            detail.events[0].eventType !== 'ORDER_REQUESTED'
          ) {
            throw new Error(`unexpected order detail: ${JSON.stringify(detail)}`);
          }

          const cancelled = await jsonRequest(`/orders/${order.id}/cancel`, {
            method: 'POST',
            headers: authHeaders,
          });

          if (cancelled.status !== 'CANCELLED') {
            throw new Error(`order was not cancelled: ${JSON.stringify(cancelled)}`);
          }

          const afterCancel = await jsonRequest(`/orders/${order.id}`, {
            headers: authHeaders,
          });

          if (
            afterCancel.status !== 'CANCELLED' ||
            afterCancel.events.length !== 2 ||
            afterCancel.events[1].eventType !== 'ORDER_CANCELLED_BY_CUSTOMER'
          ) {
            throw new Error(`unexpected cancellation timeline: ${JSON.stringify(afterCancel)}`);
          }

          const secondCancel = await fetch(`${base}/orders/${order.id}/cancel`, {
            method: 'POST',
            headers: authHeaders,
          });

          if (secondCancel.status !== 409) {
            throw new Error(`second cancel should conflict, got ${secondCancel.status}`);
          }

          const rotated = await jsonRequest('/auth/refresh', {
            method: 'POST',
            body: JSON.stringify({ refreshToken: session.refreshToken }),
          });

          if (rotated.refreshToken === session.refreshToken) {
            throw new Error('refresh token was not rotated');
          }

          const rotatedHeaders = { authorization: `Bearer ${rotated.accessToken}` };
          await jsonRequest(`/addresses/${pickup.id}`, {
            method: 'DELETE',
            headers: rotatedHeaders,
          });
          await jsonRequest(`/addresses/${dropoff.id}`, {
            method: 'DELETE',
            headers: rotatedHeaders,
          });

          await jsonRequest('/auth/logout', {
            method: 'POST',
            body: JSON.stringify({ refreshToken: rotated.refreshToken }),
          });

          const afterLogout = await fetch(`${base}/auth/refresh`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ refreshToken: rotated.refreshToken }),
          });

          if (afterLogout.status !== 401) {
            throw new Error(`logged-out refresh token should be revoked, got ${afterLogout.status}`);
          }
          NODE
