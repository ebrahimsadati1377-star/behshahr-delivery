name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/behshahr_delivery?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: 4000
      NODE_ENV: test
      SMS_PROVIDER: console
      DEV_OTP_CODE: "123456"
      OTP_SECRET: ci-otp-secret-change-me
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      SERVICE_CENTER_LAT: "36.700000"
      SERVICE_CENTER_LNG: "53.550000"
      SERVICE_RADIUS_METERS: "20000"
      ROUTE_DISTANCE_FACTOR: "1.25"
      ROUTE_AVG_SPEED_KMH: "25"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: behshahr_delivery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d behshahr_delivery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @behshahr-delivery/api prisma:validate
      - run: pnpm --filter @behshahr-delivery/api prisma:migrate:deploy
      - name: Seed CI pricing and courier
        run: |
          pnpm --filter @behshahr-delivery/api exec node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(`
              INSERT INTO "pricing_rules" (
                "id", "vehicle_type", "base_fare", "included_distance_meters",
                "per_km_fare", "minimum_fare", "surge_multiplier", "is_active",
                "created_at", "updated_at"
              ) VALUES (
                '00000000-0000-4000-8000-000000000001', 'MOTORBIKE', 50000, 1000,
                15000, 50000, 1.00, true, NOW(), NOW()
              );

              INSERT INTO "users" (
                "id", "phone", "role", "status", "created_at", "updated_at"
              ) VALUES (
                '00000000-0000-4000-8000-000000000010', '+989111111111',
                'COURIER', 'ACTIVE', NOW(), NOW()
              );

              INSERT INTO "couriers" (
                "id", "user_id", "vehicle_type", "status", "created_at", "updated_at"
              ) VALUES (
                '00000000-0000-4000-8000-000000000011',
                '00000000-0000-4000-8000-000000000010',
                'MOTORBIKE', 'OFFLINE', NOW(), NOW()
              );
            `);
            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test customer and courier lifecycle
        run: |
          pnpm --filter @behshahr-delivery/api start > /tmp/behshahr-delivery-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT

          READY=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/behshahr-delivery-api.log
            exit 1
          fi

          node <<'NODE'
          const base = 'http://127.0.0.1:4000/api';

          async function request(path, options = {}, expectedStatus) {
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: {
                'content-type': 'application/json',
                ...(options.headers ?? {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (expectedStatus !== undefined) {
              if (response.status !== expectedStatus) {
                throw new Error(`${path} expected ${expectedStatus}, got ${response.status}: ${JSON.stringify(body)}`);
              }
              return body;
            }
            if (!response.ok) {
              throw new Error(`${path} failed ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          async function login(phone) {
            await request('/auth/request-otp', {
              method: 'POST',
              body: JSON.stringify({ phone }),
            });
            return request('/auth/verify-otp', {
              method: 'POST',
              body: JSON.stringify({ phone, code: '123456' }),
            });
          }

          const customer = await login('+989112222222');
          const courier = await login('+989111111111');
          const customerHeaders = { authorization: `Bearer ${customer.accessToken}` };
          const courierHeaders = { authorization: `Bearer ${courier.accessToken}` };

          const customerMe = await request('/auth/me', { headers: customerHeaders });
          const courierMe = await request('/auth/me', { headers: courierHeaders });
          if (customerMe.user.role !== 'CUSTOMER' || courierMe.user.role !== 'COURIER') {
            throw new Error('unexpected auth roles');
          }

          await request('/courier/profile', { headers: customerHeaders }, 403);

          const pickup = await request('/addresses', {
            method: 'POST', headers: customerHeaders,
            body: JSON.stringify({
              title: 'Pickup', formattedAddress: 'CI pickup',
              latitude: 36.700000, longitude: 53.550000,
            }),
          });
          const dropoff = await request('/addresses', {
            method: 'POST', headers: customerHeaders,
            body: JSON.stringify({
              title: 'Dropoff', formattedAddress: 'CI dropoff',
              latitude: 36.710000, longitude: 53.560000,
            }),
          });
          const quote = await request('/quotes', {
            method: 'POST', headers: customerHeaders,
            body: JSON.stringify({
              pickupAddressId: pickup.id,
              dropoffAddressId: dropoff.id,
              vehicleType: 'MOTORBIKE',
            }),
          });
          const order = await request('/orders', {
            method: 'POST', headers: customerHeaders,
            body: JSON.stringify({ quoteId: quote.quoteId, notes: 'Courier CI flow' }),
          });

          const initialProfile = await request('/courier/profile', { headers: courierHeaders });
          if (initialProfile.status !== 'OFFLINE' || initialProfile.vehicleType !== 'MOTORBIKE') {
            throw new Error(`unexpected courier profile: ${JSON.stringify(initialProfile)}`);
          }

          await request('/courier/location', {
            method: 'POST', headers: courierHeaders,
            body: JSON.stringify({ latitude: 36.701, longitude: 53.551 }),
          });
          const available = await request('/courier/availability', {
            method: 'PATCH', headers: courierHeaders,
            body: JSON.stringify({ status: 'AVAILABLE' }),
          });
          if (available.status !== 'AVAILABLE') throw new Error('courier did not go available');

          const queue = await request('/courier/orders/available', { headers: courierHeaders });
          if (!Array.isArray(queue) || queue.length !== 1 || queue[0].id !== order.id) {
            throw new Error(`unexpected courier queue: ${JSON.stringify(queue)}`);
          }

          const accepted = await request(`/courier/orders/${order.id}/accept`, {
            method: 'POST', headers: courierHeaders,
          });
          if (accepted.status !== 'ASSIGNED') throw new Error('order was not assigned');

          await request(`/orders/${order.id}/cancel`, {
            method: 'POST', headers: customerHeaders,
          }, 409);

          const current = await request('/courier/orders/current', { headers: courierHeaders });
          if (!current || current.id !== order.id || current.status !== 'ASSIGNED') {
            throw new Error(`unexpected current order: ${JSON.stringify(current)}`);
          }

          const rejected = await request(`/courier/orders/${order.id}/reject`, {
            method: 'POST', headers: courierHeaders,
          });
          if (rejected.status !== 'REQUESTED' || rejected.courierId !== null) {
            throw new Error('reject did not release order');
          }

          const reaccepted = await request(`/courier/orders/${order.id}/accept`, {
            method: 'POST', headers: courierHeaders,
          });
          if (reaccepted.status !== 'ASSIGNED') throw new Error('reaccept failed');

          await request('/courier/availability', {
            method: 'PATCH', headers: courierHeaders,
            body: JSON.stringify({ status: 'OFFLINE' }),
          }, 409);

          const pickedUp = await request(`/courier/orders/${order.id}/picked-up`, {
            method: 'POST', headers: courierHeaders,
          });
          if (pickedUp.status !== 'PICKED_UP') throw new Error('pickup transition failed');

          const delivered = await request(`/courier/orders/${order.id}/delivered`, {
            method: 'POST', headers: courierHeaders,
          });
          if (
            delivered.status !== 'DELIVERED' ||
            delivered.finalPriceToman !== delivered.quotedPriceToman
          ) {
            throw new Error(`delivery transition failed: ${JSON.stringify(delivered)}`);
          }

          const finalProfile = await request('/courier/profile', { headers: courierHeaders });
          if (finalProfile.status !== 'AVAILABLE') {
            throw new Error(`courier was not released after delivery: ${JSON.stringify(finalProfile)}`);
          }

          const detail = await request(`/orders/${order.id}`, { headers: customerHeaders });
          const eventTypes = detail.events.map((event) => event.eventType);
          const expected = [
            'ORDER_REQUESTED',
            'ORDER_ACCEPTED_BY_COURIER',
            'ORDER_REJECTED_BY_COURIER',
            'ORDER_ACCEPTED_BY_COURIER',
            'ORDER_PICKED_UP',
            'ORDER_DELIVERED',
          ];
          if (JSON.stringify(eventTypes) !== JSON.stringify(expected)) {
            throw new Error(`unexpected event timeline: ${JSON.stringify(eventTypes)}`);
          }

          await request('/courier/availability', {
            method: 'PATCH', headers: courierHeaders,
            body: JSON.stringify({ status: 'OFFLINE' }),
          });
          await request(`/addresses/${pickup.id}`, { method: 'DELETE', headers: customerHeaders });
          await request(`/addresses/${dropoff.id}`, { method: 'DELETE', headers: customerHeaders });
          NODE
