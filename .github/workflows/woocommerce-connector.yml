name: WooCommerce Connector

on:
  pull_request:
    paths:
      - "apps/api/src/integrations/woocommerce/**"
      - "apps/api/src/orders/**"
      - "apps/api/src/quotes/**"
      - "apps/api/prisma/**"
      - "integrations/wordpress/behshahr-delivery-connector/**"
      - "docker-compose.dekan.yml"
      - "ops/dekan.env.example"
      - ".github/workflows/woocommerce-connector.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/integrations/woocommerce/**"
      - "apps/api/src/orders/**"
      - "apps/api/src/quotes/**"
      - "apps/api/prisma/**"
      - "integrations/wordpress/behshahr-delivery-connector/**"
      - "docker-compose.dekan.yml"
      - "ops/dekan.env.example"
      - ".github/workflows/woocommerce-connector.yml"

jobs:
  verify-woocommerce-connector:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/behshahr_delivery?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: 4000
      NODE_ENV: test
      SMS_PROVIDER: console
      DEV_OTP_CODE: "123456"
      OTP_SECRET: ci-otp-secret-change-me
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      WOOCOMMERCE_INTEGRATION_KEY: ci-woocommerce-integration-key
      SERVICE_CENTER_LAT: "36.700000"
      SERVICE_CENTER_LNG: "53.550000"
      SERVICE_RADIUS_METERS: "20000"
      ROUTING_PROVIDER: approximate
      ROUTE_DISTANCE_FACTOR: "1.25"
      ROUTE_AVG_SPEED_KMH: "25"
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: behshahr_delivery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d behshahr_delivery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @behshahr-delivery/api prisma:validate
      - run: pnpm --filter @behshahr-delivery/api prisma:migrate:deploy
      - name: Seed pricing
        run: |
          pnpm --filter @behshahr-delivery/api exec node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(`
              INSERT INTO "pricing_rules" (
                "id", "vehicle_type", "base_fare", "included_distance_meters",
                "per_km_fare", "minimum_fare", "surge_multiplier", "is_active",
                "created_at", "updated_at"
              ) VALUES (
                '00000000-0000-4000-8000-000000000001', 'MOTORBIKE', 50000, 1000,
                15000, 50000, 1.00, true, NOW(), NOW()
              );
            `);
            await client.query(`
              INSERT INTO "users" ("id","phone","role","status","created_at","updated_at") VALUES
                ('00000000-0000-4000-8000-000000000110','+989111111110','COURIER','ACTIVE',NOW(),NOW()),
                ('00000000-0000-4000-8000-000000000120','+989111111120','COURIER','ACTIVE',NOW(),NOW()),
                ('00000000-0000-4000-8000-000000000130','+989111111130','COURIER','ACTIVE',NOW(),NOW());
              INSERT INTO "couriers" ("id","user_id","vehicle_type","full_name","status","created_at","updated_at") VALUES
                ('00000000-0000-4000-8000-000000000111','00000000-0000-4000-8000-000000000110','MOTORBIKE','Driver One','AVAILABLE',NOW(),NOW()),
                ('00000000-0000-4000-8000-000000000121','00000000-0000-4000-8000-000000000120','MOTORBIKE','Driver Two','AVAILABLE',NOW(),NOW()),
                ('00000000-0000-4000-8000-000000000131','00000000-0000-4000-8000-000000000130','CAR','Driver Car','AVAILABLE',NOW(),NOW());
            `);
            await client.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - run: pnpm --filter @behshahr-delivery/api build
      - name: PHP syntax check when PHP is available
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l integrations/wordpress/behshahr-delivery-connector/behshahr-delivery-connector.php
            php -l integrations/wordpress/behshahr-delivery-connector/includes/class-bhd-courier-dispatch.php
          else
            echo "php CLI not available on runner; skipping syntax check"
          fi
      - name: Verify authentication, idempotent import, and completed sync
        run: |
          pnpm --filter @behshahr-delivery/api start > /tmp/woocommerce-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/woocommerce-api.log
              exit 1
            fi
            sleep 1
          done

          node <<'NODE'
          const url = 'http://127.0.0.1:4000/api/integrations/woocommerce/orders';
          const statusUrl = `${url}/status`;
          const payload = {
            storeId: 'dekan-ci',
            externalOrderId: '38124',
            customer: { name: 'CI Customer', phone: '09112223344' },
            pickup: {
              title: 'CI Store', formattedAddress: 'Behshahr pickup',
              latitude: 36.700000, longitude: 53.550000,
            },
            dropoff: {
              title: 'CI Customer', formattedAddress: 'Behshahr dropoff',
              latitude: 36.710000, longitude: 53.560000,
              details: 'CI destination',
            },
            vehicleType: 'MOTORBIKE',
            notes: 'WooCommerce connector CI',
            payment: { paid: true, methodId: 'online', methodTitle: 'Online' },
            metadata: { orderNumber: '38124' },
          };

          async function post(target, key, body) {
            const response = await fetch(target, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-delivery-key': key,
              },
              body: JSON.stringify(body),
            });
            const data = await response.json().catch(() => ({}));
            return { response, data };
          }

          async function send(key, body = payload) {
            return post(url, key, body);
          }

          async function complete(key, body = {
            storeId: payload.storeId,
            externalOrderId: payload.externalOrderId,
            status: 'completed',
          }) {
            return post(statusUrl, key, body);
          }

          (async () => {
            const denied = await send('wrong-key');
            if (denied.response.status !== 401) {
              throw new Error(`wrong integration key expected 401, got ${denied.response.status}`);
            }

            const first = await send('ci-woocommerce-integration-key');
            if (!first.response.ok || first.data.duplicate !== false) {
              throw new Error(`first import failed: ${first.response.status} ${JSON.stringify(first.data)}`);
            }
            if (first.data.order?.status !== 'REQUESTED') throw new Error('imported order is not REQUESTED');
            if (first.data.order?.payment?.status !== 'PAID') throw new Error('paid Woo order did not import as PAID');

            const second = await send('ci-woocommerce-integration-key');
            if (!second.response.ok || second.data.duplicate !== true) {
              throw new Error(`duplicate import failed: ${second.response.status} ${JSON.stringify(second.data)}`);
            }
            if (second.data.order?.id !== first.data.order?.id) {
              throw new Error('duplicate import created a different Delivery order');
            }


            const key = 'ci-woocommerce-integration-key';
            const baseUrl = 'http://127.0.0.1:4000/api/integrations/woocommerce';
            const courierListUnauthorized = await fetch(baseUrl + '/couriers', {headers:{'x-delivery-key':'wrong-key'}});
            if (courierListUnauthorized.status !== 401) throw new Error('courier list leaked without valid integration key');
            const courierList = await fetch(baseUrl + '/couriers', {headers:{'x-delivery-key':key}});
            const courierListBody = await courierList.json();
            if (!courierList.ok || courierListBody.length !== 3) throw new Error('courier list incorrect');

            const linkLookup = (storeId, externalOrderId) => baseUrl + '/orders/assignment?'
              + new URLSearchParams({storeId,externalOrderId}).toString();
            const target1='00000000-0000-4000-8000-000000000111';
            const target2='00000000-0000-4000-8000-000000000121';
            const targetCar='00000000-0000-4000-8000-000000000131';
            const dispatchOrder = {...payload, externalOrderId:'38126', metadata:{orderNumber:'38126'}};
            const unlinked=await post(baseUrl+'/orders/assign',key,{
              storeId:payload.storeId,externalOrderId:'no-such-order',courierId:target1
            });
            if(unlinked.response.status!==404) throw new Error('unlinked order could be assigned');
            const importDispatch = await send(key,dispatchOrder);
            if(!importDispatch.response.ok || importDispatch.data.duplicate) throw new Error('dispatch order import failed');
            const beforeAssignment = await (await fetch(linkLookup(dispatchOrder.storeId,dispatchOrder.externalOrderId),{
              headers:{'x-delivery-key':key}
            })).json();
            if(!beforeAssignment.linked || beforeAssignment.status!=='REQUESTED') throw new Error('linked order not requested');
            const mismatched = await post(baseUrl+'/orders/assign',key,{
              storeId:dispatchOrder.storeId,externalOrderId:dispatchOrder.externalOrderId,courierId:targetCar
            });
            if(mismatched.response.status!==409) throw new Error('wrong vehicle accepted');

            const assigned = await post(baseUrl+'/orders/assign',key,{
              storeId:dispatchOrder.storeId,externalOrderId:dispatchOrder.externalOrderId,courierId:target1
            });
            if(!assigned.response.ok || assigned.data.status!=='ASSIGNED' || assigned.data.courierId!==target1) {
              throw new Error('courier assignment failed: '+JSON.stringify(assigned.data));
            }
            const assignedAgain=await post(baseUrl+'/orders/assign',key,{
              storeId:dispatchOrder.storeId,externalOrderId:dispatchOrder.externalOrderId,courierId:target1
            });
            if(!assignedAgain.response.ok || assignedAgain.data.unchanged!==true) throw new Error('duplicate assignment was not idempotent');

            const busyReassignment=await post(baseUrl+'/orders/assign',key,{
              storeId:dispatchOrder.storeId,externalOrderId:dispatchOrder.externalOrderId,courierId:target1
            });
            if(!busyReassignment.response.ok) throw new Error('same courier retry should succeed');

            const reassigned=await post(baseUrl+'/orders/assign',key,{
              storeId:dispatchOrder.storeId,externalOrderId:dispatchOrder.externalOrderId,courierId:target2
            });
            if(!reassigned.response.ok || reassigned.data.courierId!==target2) throw new Error('reassign failed');
            const currentStatus=await (await fetch(linkLookup(dispatchOrder.storeId,dispatchOrder.externalOrderId),{
              headers:{'x-delivery-key':key}
            })).json();
            if(currentStatus.status!=='ASSIGNED' || currentStatus.courierId!==target2) throw new Error('assignment GET inconsistent');
            const couriersAfter=(await (await fetch(baseUrl+'/couriers',{headers:{'x-delivery-key':key}})).json());
            if(couriersAfter.find(c=>c.id===target1)?.status!=='AVAILABLE'
              || couriersAfter.find(c=>c.id===target2)?.status!=='BUSY') throw new Error('courier statuses incorrect');

            const loginPhone='+989111111120';
            await fetch('http://127.0.0.1:4000/api/auth/request-otp',{
              method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({phone:loginPhone})
            });
            const verified=await (await fetch('http://127.0.0.1:4000/api/auth/verify-otp',{
              method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({phone:loginPhone,code:'123456'})
            })).json());
            if(!verified.accessToken) throw new Error('courier OTP login failed');
            const current=await (await fetch('http://127.0.0.1:4000/api/courier/orders/current',{
              headers:{authorization:'Bearer '+verified.accessToken}
            })).json());
            if(current?.id!==importDispatch.data.order.id) throw new Error('assigned Woo order not visible in courier panel');

            const deniedAssign=await post(baseUrl+'/orders/assign','wrong-key',{
              storeId:dispatchOrder.storeId,externalOrderId:dispatchOrder.externalOrderId,courierId:target1
            });
            if(deniedAssign.response.status!==401) throw new Error('invalid key accepted by assignment API');
            const crossStore=await post(baseUrl+'/orders/assign',key,{
              storeId:'different-store',externalOrderId:dispatchOrder.externalOrderId,courierId:target1
            });
            if(crossStore.response.status!==404) throw new Error('cross-store assignment succeeded');

            const deniedComplete = await complete('wrong-key');
            if (deniedComplete.response.status !== 401) {
              throw new Error(`wrong status-sync key expected 401, got ${deniedComplete.response.status}`);
            }

            const completed = await complete('ci-woocommerce-integration-key');
            if (!completed.response.ok || completed.data.synced !== true) {
              throw new Error(`completed sync failed: ${completed.response.status} ${JSON.stringify(completed.data)}`);
            }
            if (completed.data.order?.id !== first.data.order?.id) {
              throw new Error('completed sync targeted a different Delivery order');
            }
            if (completed.data.order?.status !== 'DELIVERED') {
              throw new Error(`completed Woo order did not become DELIVERED: ${JSON.stringify(completed.data)}`);
            }

            const completedAgain = await complete('ci-woocommerce-integration-key');
            if (!completedAgain.response.ok || completedAgain.data.alreadyCompleted !== true) {
              throw new Error(`idempotent completed sync failed: ${completedAgain.response.status} ${JSON.stringify(completedAgain.data)}`);
            }
            if (completedAgain.data.order?.id !== first.data.order?.id || completedAgain.data.order?.status !== 'DELIVERED') {
              throw new Error('repeated completed sync changed the linked Delivery order');
            }

            const invalidPhonePayload = {
              ...payload,
              externalOrderId: '38125',
              customer: { ...payload.customer, phone: 'invalid' },
            };
            const invalidPhone = await send('ci-woocommerce-integration-key', invalidPhonePayload);
            if (invalidPhone.response.status !== 400) {
              throw new Error(`invalid phone expected 400, got ${invalidPhone.response.status}`);
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
