name: behshahr-delivery

x-app-build: &app-build
  context: .
  dockerfile: ops/docker/Dockerfile

x-app-restart: &app-restart
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: behshahr_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d behshahr_delivery"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  migrate:
    build:
      <<: *app-build
      args:
        APP_FILTER: "@behshahr-delivery/api"
        APP_PORT: "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["sh", "-c", "pnpm --filter @behshahr-delivery/api prisma:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    <<: *app-restart
    build:
      <<: *app-build
      args:
        APP_FILTER: "@behshahr-delivery/api"
        APP_PORT: "4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      SMS_PROVIDER: ippanel
      IPPANEL_API_KEY: ${IPPANEL_API_KEY:?IPPANEL_API_KEY is required}
      IPPANEL_FROM_NUMBER: ${IPPANEL_FROM_NUMBER:?IPPANEL_FROM_NUMBER is required}
      IPPANEL_OTP_PATTERN_CODE: ${IPPANEL_OTP_PATTERN_CODE:?IPPANEL_OTP_PATTERN_CODE is required}
      IPPANEL_OTP_PARAM_NAME: ${IPPANEL_OTP_PARAM_NAME:-code}
      IPPANEL_API_BASE_URL: ${IPPANEL_API_BASE_URL:-https://edge.ippanel.com}
      IPPANEL_TIMEOUT_MS: ${IPPANEL_TIMEOUT_MS:-5000}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-auto}
      NESHAN_SERVICE_API_KEY: ${NESHAN_SERVICE_API_KEY:-}
      NESHAN_API_BASE_URL: ${NESHAN_API_BASE_URL:-https://api.neshan.org}
      NESHAN_ROUTING_TIMEOUT_MS: ${NESHAN_ROUTING_TIMEOUT_MS:-5000}
      SERVICE_CENTER_LAT: ${SERVICE_CENTER_LAT:-36.6980}
      SERVICE_CENTER_LNG: ${SERVICE_CENTER_LNG:-53.5520}
      SERVICE_RADIUS_METERS: ${SERVICE_RADIUS_METERS:-15000}
      ROUTE_DISTANCE_FACTOR: ${ROUTE_DISTANCE_FACTOR:-1.25}
      ROUTE_AVG_SPEED_KMH: ${ROUTE_AVG_SPEED_KMH:-25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  customer:
    <<: *app-restart
    build:
      <<: *app-build
      args:
        APP_FILTER: "@behshahr-delivery/customer"
        APP_PORT: "3000"
        NEXT_PUBLIC_NESHAN_MAP_KEY: ${NEXT_PUBLIC_NESHAN_MAP_KEY:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
    networks: [frontend, backend]

  courier:
    <<: *app-restart
    build:
      <<: *app-build
      args:
        APP_FILTER: "@behshahr-delivery/courier"
        APP_PORT: "3001"
        NEXT_PUBLIC_NESHAN_MAP_KEY: ${NEXT_PUBLIC_NESHAN_MAP_KEY:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
    networks: [frontend, backend]

  admin:
    <<: *app-restart
    build:
      <<: *app-build
      args:
        APP_FILTER: "@behshahr-delivery/admin"
        APP_PORT: "3002"
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
    networks: [frontend, backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN:?CUSTOMER_DOMAIN is required}
      COURIER_DOMAIN: ${COURIER_DOMAIN:?COURIER_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      customer:
        condition: service_healthy
      courier:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
